name: Build and Deploy Cat's Blog

on:
  push:
    branches:
      - source

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 Hexo 依赖
        run: |
          npm ci

      - name: 提取内嵌图片(base64)避免渲染崩溃
        run: |
          node scripts/extract-base64.js

      - name: 编译静态页面
        run: |
          npx hexo clean
          npx hexo generate

      - name: 部署到 GitHub Pages (main 分支)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: ${{ github.event.head_commit.message }}
